name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check hostinger.js
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: php -l api/config.php
      - run: php -l api/gemini.php
